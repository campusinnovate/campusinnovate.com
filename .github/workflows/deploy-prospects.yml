name: Deploy Prospect Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prospect-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::Add repository secret SUPABASE_ACCESS_TOKEN, then rerun this workflow.'
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Google connections
        run: supabase functions deploy prospect-google --project-ref lxwqhtuhlddgwfxjtlas --use-api
      - name: Deploy prospect discovery
        run: supabase functions deploy prospect-harvest --project-ref lxwqhtuhlddgwfxjtlas --use-api
      - name: Verify deployed preflight and authentication
        run: node scripts/check-prospect-google.mjs
