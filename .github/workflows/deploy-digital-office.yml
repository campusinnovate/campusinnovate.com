name: Deploy Digital Office Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-digital-office
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Supabase deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::Set repository secret SUPABASE_ACCESS_TOKEN to deploy Digital Office.'
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        run: supabase functions deploy digital-office --project-ref lxwqhtuhlddgwfxjtlas --use-api
      - name: Verify CORS and authentication
        run: node scripts/check-digital-office.mjs
