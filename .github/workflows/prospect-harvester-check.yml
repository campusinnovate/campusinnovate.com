name: Prospect Harvester Check

on:
  push:
    branches:
      - codex/prospect-harvester-mvp
  pull_request:
    branches:
      - codex/web-handoff
    paths:
      - 'src/app/ruang-kawan/prospects/**'
      - 'src/lib/supabase/**'
      - 'supabase/functions/prospect-*/**'
      - 'supabase/migrations/20260904113000_ruang_kawan_prospect_harvester.sql'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/prospect-harvester-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static export build
        run: npm run build
